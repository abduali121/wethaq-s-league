<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>الأمور المالية - دوري وثاق</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
  .sec-title{
    font-size:12px;font-weight:800;color:var(--text2);margin:0 0 12px;display:flex;align-items:center;gap:6px;
  }
  .sec-title svg{ width:13px;height:13px;color:var(--gold-deep);flex-shrink:0; }

  .fin-team-card{ margin-bottom:18px;overflow:hidden; }
  .fin-team-head{
    display:flex;align-items:center;justify-content:space-between;padding:14px 16px;
    border-bottom:1px solid var(--border);
  }
  .fin-team-head .name{ font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px; }
  .fin-team-head .badge{ width:26px;height:26px;border-radius:8px;flex-shrink:0; }
  .fin-team-head .balance{ font-weight:800;font-size:16px;color:var(--accent); }
  [data-theme="dark"] .fin-team-head .balance{ color:var(--gold); }

  .fin-subhead{
    font-size:11px;font-weight:800;color:var(--text2);padding:9px 16px;background:var(--surface2);
    border-bottom:1px solid var(--border);
  }
  .fin-row{
    display:grid;grid-template-columns:1fr 62px 68px;gap:6px;align-items:center;
    padding:9px 16px;border-bottom:1px solid var(--border);font-size:12px;
  }
  .fin-row:last-child{ border-bottom:none; }
  .fin-row.head{ font-size:10px;font-weight:800;color:var(--text2);background:var(--surface2); }
  .fin-row .desc{ font-weight:600;line-height:1.5; }
  .fin-row .delta{ font-weight:800;text-align:center; }
  .fin-row .delta.pos{ color:var(--green); }
  .fin-row .delta.neg{ color:var(--red); }
  .fin-row .bal{ font-weight:800;text-align:center; }
  .fin-empty{ padding:14px 16px;text-align:center;font-size:11.5px;color:var(--text2); }

  .week-filters{ display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px; }
  .week-chip{
    flex-shrink:0;padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:700;
    border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;white-space:nowrap;
  }
  .week-chip.active{ background:var(--accent);color:#fff;border-color:var(--accent); }
</style>
</head>
<body>
<header id="appHeader"></header>
<main class="container">
  <div class="sec-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1 3 2.2c0 2.8-6 1.3-6 4.1 0 1.2 1.3 2.2 3 2.2s3-1.1 3-2.5"/></svg>
    الأمور المالية
  </div>
  <div id="weekFilters" class="week-filters"></div>
  <div id="teamsWrap"><div class="fin-empty">جارٍ التحميل...</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script><script src="js/auth.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/header.js"></script>
<script src="js/api/teams.js"></script>
<script src="js/api/finances.js"></script>
<script>
function rowHtml(desc, delta, bal){
  return `
    <div class="fin-row">
      <div class="desc">${desc}</div>
      <div class="delta ${delta >= 0 ? 'pos' : 'neg'}">${delta >= 0 ? '+' : ''}${delta}</div>
      <div class="bal">${bal}</div>
    </div>
  `;
}

function headRowHtml(){
  return `
    <div class="fin-row head">
      <div>الحدث</div><div>التغيير</div><div>الرصيد</div>
    </div>
  `;
}

// يبني نص وصف كل حركة بلغة عادية، مع اسم اللاعب ولو ما جاب بدلته، بدل اسم السبب التقني
function describeRow(r, teamName){
  if(r.reason === "match_result") return r.delta >= 0 ? `فاز ${teamName}` : `خسر ${teamName}`;
  if(r.reason === "kit_penalty") return `"${r._kitPlayerName || 'لاعب'}" بدون بدلة`;
  if(r.reason === "loan_fee"){
    const player = r.loan?.player?.full_name || "لاعب مستعار";
    return `استعارة "${player}"${r._kitMissing ? " (لم يحضر بدلته)" : ""}`;
  }
  if(r.reason === "loan_fee_credit"){
    const player = r.loan?.player?.full_name || "لاعب";
    const borrower = r.loan?.borrowing_team?.name || "فريق آخر";
    return `فريق ${borrower} استعار "${player}"${r._kitMissing ? " (لم يحضر بدلته)" : ""}`;
  }
  return r.reason;
}

let allTeams = [], allLedger = [], matchWeekById = new Map();
let activeWeek = null; // null = كل الأسابيع

function renderWeekFilters(){
  const weeks = [...new Set(allLedger.map(r => matchWeekById.get(r.match_id)).filter(Boolean))].sort((a, b) => a - b);
  document.getElementById("weekFilters").innerHTML = [
    ...weeks.map(w => `<div class="week-chip ${activeWeek === w ? 'active' : ''}" onclick="onFilterWeek(${w})">الأسبوع ${w}</div>`),
    `<div class="week-chip ${activeWeek === null ? 'active' : ''}" onclick="onFilterWeek(null)">كل الأسابيع</div>`,
  ].join("");
}

function onFilterWeek(week){
  activeWeek = week;
  renderWeekFilters();
  renderTeamCards();
}

function renderTeamCards(){
  const ledger = activeWeek === null
    ? allLedger
    : allLedger.filter(r => matchWeekById.get(r.match_id) === activeWeek);

  const byTeam = new Map(allTeams.map(t => [t.id, { main: [], credits: [] }]));
  for(const r of ledger){
    if(!byTeam.has(r.team_id)) continue;
    const bucket = r.reason === "loan_fee_credit" ? "credits" : "main";
    byTeam.get(r.team_id)[bucket].push(r);
  }

  document.getElementById("teamsWrap").innerHTML = allTeams.map(t => {
    const { main, credits } = byTeam.get(t.id);
    const mainHtml = main.length
      ? headRowHtml() + main.map(r => rowHtml(describeRow(r, t.name), r.delta, r.balance_after)).join("")
      : `<div class="fin-empty">لا توجد أحداث بعد</div>`;
    const creditsHtml = credits.length
      ? `<div class="fin-subhead">مكافآت الاستعارة</div>` + headRowHtml() + credits.map(r => rowHtml(describeRow(r, t.name), r.delta, r.balance_after)).join("")
      : "";

    return `
      <div class="card glass fin-team-card">
        <div class="fin-team-head">
          <span class="name">
            <span class="badge" style="background:${t.primary_color || '#0f2a4a'};"></span>
            ${t.name}
          </span>
          <span class="balance">${t.balance_wathaq}</span>
        </div>
        ${mainHtml}
        ${creditsHtml}
      </div>
    `;
  }).join("");
}

async function loadFinances(){
  const [teams, ledger, matches] = await Promise.all([listTeams(), listTeamLedgerEvents(), listMatchWeeks()]);
  allTeams = teams;
  allLedger = ledger;
  matchWeekById = new Map(matches.map(m => [m.id, m.week?.week_number || null]));

  const matchIds = [...new Set(ledger.map(r => r.match_id).filter(Boolean))];
  const kitRows = await listKitMissingWithContext(matchIds);
  // مفتاح "مباراة:لاعب" لمعرفة هل هذا اللاعب بالذات ما جاب بدلته بهذي المباراة تحديدًا
  const kitMissingKeys = new Set(kitRows.map(k => `${k.match_id}:${k.player.id}`));
  // أسماء اللاعبين الأصليين (غير المعارين) اللي ما جابوا بدلهم، بالترتيب — تُسحب بالتتابع
  // على صفوف kit_penalty لنفس (المباراة، الفريق) لأنه ما فيه ربط مباشر بلاعب معيّن بالسجل
  const ownKitMissingByMatchTeam = new Map();
  for(const k of kitRows){
    if(k.player.original_team_id !== k.team_id) continue;
    const key = `${k.match_id}:${k.team_id}`;
    if(!ownKitMissingByMatchTeam.has(key)) ownKitMissingByMatchTeam.set(key, []);
    ownKitMissingByMatchTeam.get(key).push(k.player.full_name);
  }

  for(const r of allLedger){
    if(r.loan) r._kitMissing = kitMissingKeys.has(`${r.match_id}:${r.loan.player_id}`);
    if(r.reason === "kit_penalty"){
      const key = `${r.match_id}:${r.team_id}`;
      const names = ownKitMissingByMatchTeam.get(key) || [];
      r._kitPlayerName = names.shift();
    }
  }

  // افتراضيًا نعرض آخر أسبوع فيه أحداث، عشان الصفحة تبقى مرتّبة كل ما تزيد الأسابيع
  const weeksWithEvents = [...new Set(allLedger.map(r => matchWeekById.get(r.match_id)).filter(Boolean))];
  activeWeek = weeksWithEvents.length ? Math.max(...weeksWithEvents) : null;

  renderWeekFilters();
  renderTeamCards();
}

(async function(){
  const profile = await requireAuth();
  if(!profile) return;
  renderHeader(profile, "finances");
  await loadFinances();

  sb.channel("finances-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "balance_ledger" }, loadFinances)
    .on("postgres_changes", { event: "*", schema: "public", table: "teams" }, loadFinances)
    .subscribe();
})();
</script>
</body>
</html>
