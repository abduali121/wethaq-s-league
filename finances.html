<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>الأمور المالية - دوري وثاق</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
  .sec-title{
    font-size:12px;font-weight:800;color:var(--text2);margin:0 0 12px;display:flex;align-items:center;gap:6px;
  }
  .sec-title svg{ width:13px;height:13px;color:var(--gold-deep);flex-shrink:0; }

  .team-filters{ display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px; }
  .team-chip{
    flex-shrink:0;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;
    font-size:11.5px;font-weight:700;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;
  }
  .team-chip .dot{ width:9px;height:9px;border-radius:50%;flex-shrink:0; }
  .team-chip.active{ background:var(--accent);color:#fff;border-color:var(--accent); }

  .m-card{ margin-bottom:14px;overflow:hidden; }
  .m-head{
    display:flex;align-items:center;justify-content:space-between;padding:12px 14px;
    border-bottom:1px solid var(--border);font-size:11.5px;color:var(--text2);font-weight:700;
  }
  .m-body{ padding:12px 14px;display:flex;flex-direction:column;gap:8px; }
  .m-event{ font-size:12.5px;font-weight:600;line-height:1.6;display:flex;gap:6px; }
  .m-event .amt{ font-weight:800;flex-shrink:0; }
  .m-event .amt.pos{ color:var(--green); }
  .m-event .amt.neg{ color:var(--red); }
  .m-final{
    display:flex;justify-content:space-between;align-items:center;gap:10px;
    padding:12px 14px;border-top:1px solid var(--border);background:var(--surface2);
  }
  .m-final .team{ display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700; }
  .m-final .team .dot{ width:9px;height:9px;border-radius:50%;flex-shrink:0; }
  .m-final .bal{ font-size:19px;font-weight:800;color:var(--accent); }
  [data-theme="dark"] .m-final .bal{ color:var(--gold); }
  .fin-empty{ padding:16px;text-align:center;font-size:12px;color:var(--text2); }
</style>
</head>
<body>
<header id="appHeader"></header>
<main class="container">
  <div class="sec-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.4 1.3-2.5 3-2.5s3 1 3 2.2c0 2.8-6 1.3-6 4.1 0 1.2 1.3 2.2 3 2.2s3-1.1 3-2.5"/></svg>
    الأمور المالية
  </div>
  <div id="teamFilters" class="team-filters"></div>
  <div id="matchesWrap"><div class="fin-empty">جارٍ التحميل...</div></div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script><script src="js/auth.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/header.js"></script>
<script src="js/api/teams.js"></script>
<script src="js/api/finances.js"></script>
<script>
let allMatches = [], allTeams = [], loansByMatch = new Map(), kitByMatch = new Map();
let activeTeamId = null;

function buildMatchEvents(m){
  const events = [];
  const winner = m.winner_team_id === m.team_a.id ? m.team_a : m.team_b;
  const loser  = m.winner_team_id === m.team_a.id ? m.team_b : m.team_a;
  const winnerStake = m.winner_team_id === m.team_a.id ? m.team_a_stake : m.team_b_stake;
  const loserStake  = m.winner_team_id === m.team_a.id ? m.team_b_stake : m.team_a_stake;
  events.push({
    icon: "🏆",
    html: `فاز <b>${winner.name}</b> على ${loser.name}`,
    amt: `+${winnerStake} / -${loserStake}`,
  });

  const kitRows = kitByMatch.get(m.id) || [];
  const loanedKitMissingPlayerIds = new Set(
    kitRows.filter(k => k.player.original_team_id !== k.team_id).map(k => k.player.id)
  );

  for(const loan of (loansByMatch.get(m.id) || [])){
    const kitMissing = loanedKitMissingPlayerIds.has(loan.player.id);
    const fee = loan.fee_settled ? (kitMissing ? Math.ceil(loan.winning_bid_amount / 2) : loan.winning_bid_amount) : 0;
    events.push({
      icon: "🔄",
      html: `<b>${loan.borrowing_team.name}</b> تعاقد مع "${loan.player.full_name}" من ${loan.original_team.name}${kitMissing ? " (بدون بدلة — رسم منصّف)" : ""}${!loan.fee_settled ? " — لم يُدفع (الفريق المستعير خسر)" : ""}`,
      amt: fee ? `-${fee}` : null,
    });
  }

  for(const k of kitRows){
    if(k.player.original_team_id === k.team_id){
      const team = k.team_id === m.team_a.id ? m.team_a : m.team_b;
      events.push({ icon: "🎽", html: `"${k.player.full_name}" بدون بدلة — ${team.name}`, amt: "-40" });
    }
  }

  return events;
}

function matchCard(m){
  const events = buildMatchEvents(m);
  return `
    <div class="card glass m-card">
      <div class="m-head">
        <span>الأسبوع ${m.week?.week_number ?? "?"}</span>
        <span>${m.team_a.name} × ${m.team_b.name}</span>
      </div>
      <div class="m-body">
        ${events.map(e => `
          <div class="m-event">
            <span>${e.icon}</span>
            <span style="flex:1;">${e.html}</span>
            ${e.amt ? `<span class="amt ${e.amt.startsWith('-') ? 'neg' : 'pos'}">${e.amt}</span>` : ""}
          </div>
        `).join("")}
      </div>
      <div class="m-final">
        <div class="team"><span class="dot" style="background:${m.team_a.primary_color || '#0f2a4a'};"></span>${m.team_a.name}</div>
        <div class="bal">${m.team_a_balance_after}</div>
      </div>
      <div class="m-final">
        <div class="team"><span class="dot" style="background:${m.team_b.primary_color || '#0f2a4a'};"></span>${m.team_b.name}</div>
        <div class="bal">${m.team_b_balance_after}</div>
      </div>
    </div>
  `;
}

function renderMatchesList(){
  const filtered = activeTeamId
    ? allMatches.filter(m => m.team_a.id === activeTeamId || m.team_b.id === activeTeamId)
    : allMatches;
  document.getElementById("matchesWrap").innerHTML = filtered.length
    ? filtered.map(matchCard).join("")
    : `<div class="fin-empty">لا توجد مباريات مكتملة بعد</div>`;
}

function renderTeamFilters(){
  document.getElementById("teamFilters").innerHTML = [
    `<div class="team-chip ${activeTeamId === null ? 'active' : ''}" onclick="onFilterTeam(null)">الكل</div>`,
    ...allTeams.map(t => `
      <div class="team-chip ${activeTeamId === t.id ? 'active' : ''}" onclick="onFilterTeam('${t.id}')">
        <span class="dot" style="background:${t.primary_color || '#0f2a4a'};"></span>${t.name}
      </div>
    `),
  ].join("");
}

async function renderFinances(){
  const [teams, matches] = await Promise.all([listTeams(), listFinancialMatches()]);
  allTeams = teams;
  allMatches = matches;
  const matchIds = matches.map(m => m.id);
  const [loans, kits] = await Promise.all([listMatchLoansWithContext(matchIds), listKitMissingWithContext(matchIds)]);

  loansByMatch = new Map();
  for(const l of loans){
    if(!loansByMatch.has(l.match_id)) loansByMatch.set(l.match_id, []);
    loansByMatch.get(l.match_id).push(l);
  }
  kitByMatch = new Map();
  for(const k of kits){
    if(!kitByMatch.has(k.match_id)) kitByMatch.set(k.match_id, []);
    kitByMatch.get(k.match_id).push(k);
  }

  renderTeamFilters();
  renderMatchesList();
}

function onFilterTeam(teamId){
  activeTeamId = teamId;
  renderTeamFilters();
  renderMatchesList();
}

(async function(){
  const profile = await requireAuth();
  if(!profile) return;
  renderHeader(profile, "finances");
  await renderFinances();

  sb.channel("finances-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, renderFinances)
    .on("postgres_changes", { event: "*", schema: "public", table: "match_loans" }, renderFinances)
    .on("postgres_changes", { event: "*", schema: "public", table: "match_lineups" }, renderFinances)
    .subscribe();
})();
</script>
</body>
</html>
