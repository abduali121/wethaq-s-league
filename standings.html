<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>الرئيسية - دوري وثاق</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
  .live-strip{
    display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;color:var(--green);
    margin:0 0 16px;
  }
  .live-strip .dot{
    width:6px;height:6px;border-radius:50%;background:var(--green);
    animation:pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 0 rgba(22,163,74,.5)} 50%{box-shadow:0 0 0 4px rgba(22,163,74,0)} }

  .sec-title{
    font-size:12px;font-weight:800;color:var(--text2);margin:0 0 10px;display:flex;align-items:center;gap:6px;
  }
  .sec-title svg{ width:13px;height:13px;color:var(--gold-deep);flex-shrink:0; }
  .sec-title.blue svg{ color:var(--blue); }
  .sec-title.green svg{ color:var(--green); }
  .sec-title.navy svg{ color:var(--accent); }

  /* دخول تدريجي للأقسام عند فتح الصفحة */
  @keyframes revealUp{ from{ opacity:0;transform:translateY(14px); } to{ opacity:1;transform:translateY(0); } }
  .reveal{ opacity:0;animation:revealUp .55s cubic-bezier(.16,1,.3,1) forwards; }
  @media (prefers-reduced-motion:reduce){ .reveal{ animation:none;opacity:1; } }

  /* مباريات الأسبوع — بطاقة واحدة تتغيّر تلقائيًا مثل التصريحات بالضبط */
  .matches-wrap{ margin-bottom:26px; }
  .matches-stack{ position:relative;display:grid;overflow:hidden;border-radius:var(--radius-lg); }
  .match-card{
    grid-area:1/1;opacity:0;pointer-events:none;transform:translateX(32px);
    transition:opacity .4s ease,transform .4s ease;
    border-radius:var(--radius-lg);padding:16px 18px;position:relative;overflow:hidden;
    background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:1px solid var(--gold);
    box-shadow:0 14px 26px -12px rgba(15,37,64,.5);cursor:pointer;
  }
  .match-card.active{ opacity:1;transform:translateX(0);pointer-events:auto; }
  .match-card.leaving{ opacity:0;transform:translateX(-32px); }
  .match-card.empty{
    opacity:1;transform:none;position:relative;display:flex;align-items:center;justify-content:center;
    min-height:64px;background:var(--surface);border:1px dashed var(--border);color:var(--text2);
    font-size:12.5px;font-weight:700;box-shadow:none;cursor:default;
  }
  .mc-week{ font-size:10px;font-weight:800;color:var(--gold);margin-bottom:8px; }
  .mc-teams{ display:flex;align-items:center;justify-content:space-between; }
  .mc-team{ display:flex;flex-direction:column;align-items:center;gap:6px;width:36%;text-align:center;min-width:0; }
  .mc-crest{
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;border:1.5px solid rgba(255,255,255,.3);flex-shrink:0;
    box-shadow:0 3px 8px -2px rgba(0,0,0,.35);
  }
  .mc-name{ font-size:11.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%; }
  .mc-vs{ font-size:11px;font-weight:800;color:var(--gold);flex-shrink:0; }
  .mc-stakes{ display:flex;justify-content:space-between;margin-top:12px;gap:8px; }
  .mc-stake{
    font-size:9.5px;font-weight:800;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);
    padding:4px 10px;border-radius:999px;
  }
  .mc-result{ text-align:center;margin-top:12px;font-size:12px;font-weight:800;color:var(--gold); }
  .mc-cta{
    position:absolute;left:14px;bottom:14px;width:24px;height:24px;border-radius:50%;
    background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
  }
  .mc-cta svg{ width:12px;height:12px; }

  /* تصريحات الدوري — نص فقط، كل تصريح مستطيله الخاص والمستطيل كامل هو اللي ينزلق */
  .ticker-wrap{ margin-bottom:26px; }
  .ticker{ position:relative;display:grid;overflow:hidden;min-height:64px; }
  .tick{
    grid-area:1/1;display:flex;flex-direction:column;gap:6px;opacity:0;pointer-events:none;
    transform:translateX(32px);transition:opacity .4s ease,transform .4s ease;
    border:1px solid var(--border);border-radius:var(--radius-lg);padding:14px 16px;
    border-inline-start:3px solid var(--team-color, var(--gold));
    background:linear-gradient(135deg, color-mix(in srgb, var(--team-color, var(--gold)) 10%, var(--surface)), var(--surface));
  }
  .tick-row{ display:flex;align-items:flex-start;gap:10px; }
  .tick.active{ opacity:1;transform:translateX(0);pointer-events:auto; }
  .tick.leaving{ opacity:0;transform:translateX(-32px); }
  .tick.empty{
    opacity:1;transform:none;position:relative;color:var(--text2);font-size:12.5px;font-weight:700;
    align-items:center;justify-content:center;
  }
  .tick .tb{
    font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:999px;flex-shrink:0;white-space:nowrap;margin-top:1px;
  }
  .tick .tt{ font-size:12.5px;font-weight:700;line-height:1.55; }
  .dots{ display:flex;gap:5px;justify-content:center;margin-top:10px; }
  .dseg{ width:16px;height:3px;border-radius:2px;background:var(--border);overflow:hidden;position:relative; }
  /* الشريط المرئي رفيع (3px)، لكن منطقة اللمس أكبر بكثير عشان يسهل الضغط عليه بالجوال */
  .dseg::before{ content:"";position:absolute;top:-12px;bottom:-12px;left:-3px;right:-3px; }
  .dseg i{
    position:absolute;inset:0;background:var(--gold);transform:scaleX(0);transform-origin:right;
    display:block;transition:transform linear;
  }

  /* صور الدوري — قسم مستقل عن التصريحات: صورة بمقاس ثابت موحّد (4:3) + تعليق فقط */
  .photos-wrap{ margin-bottom:26px; }
  .photo-stack{ position:relative;display:grid;overflow:hidden;border-radius:var(--radius-lg); }
  .photo-item{
    grid-area:1/1;opacity:0;pointer-events:none;transform:translateX(32px);
    transition:opacity .4s ease,transform .4s ease;
    background:var(--surface);border-radius:var(--radius-lg);overflow:hidden;
    box-shadow:0 12px 26px -14px rgba(15,37,64,.4);
  }
  .photo-item.active{ opacity:1;transform:translateX(0);pointer-events:auto; }
  .photo-item.leaving{ opacity:0;transform:translateX(-32px); }
  .photo-item.empty{
    opacity:1;transform:none;position:relative;display:flex;align-items:center;justify-content:center;
    min-height:64px;padding:14px 16px;color:var(--text2);font-size:12.5px;font-weight:700;
    border:1px dashed var(--border);box-shadow:none;
  }
  .photo-frame-pub{ width:100%;aspect-ratio:4/3;position:relative; }
  .photo-frame-pub img{ width:100%;height:100%;object-fit:cover;display:block; }
  .photo-caption-pub{
    position:absolute;inset-inline:0;bottom:0;padding:30px 16px 12px;
    background:linear-gradient(to top, rgba(10,15,25,.8), transparent);
    color:#fff;font-size:12.5px;font-weight:700;line-height:1.5;
  }
  .photo-caption-pub .tb{
    font-size:9.5px;font-weight:800;padding:3px 9px;border-radius:999px;margin-inline-end:6px;
    background:rgba(255,255,255,.2);color:#fff;
  }

  /* توقعات مفتوحة */
  .predhub-card{ padding:14px;margin-bottom:10px; }
  .predhub-head{ display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:10px; }
  .predhub-week{ font-weight:800;color:var(--text2); }
  .predhub-reward{ font-weight:800;color:var(--gold-deep);background:var(--gold-light);padding:3px 10px;border-radius:999px;font-size:11px; }
  .predhub-row{ display:flex;gap:8px; }
  .predhub-btn{
    flex:1;padding:10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface2);
    color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer;
  }
  .predhub-btn.picked{ background:var(--gold);color:#2a2103;border-color:var(--gold); }

  /* الترتيب */
  .podium{
    display:block;position:relative;border-radius:var(--radius-lg);padding:16px 16px 14px;margin-bottom:10px;overflow:hidden;
    background:linear-gradient(150deg,var(--accent),var(--accent2));border:1px solid var(--gold);color:#fff;
    cursor:pointer;
  }
  /* لمعة خفيفة تمر على كرت المتصدّر كل شوي — تحسسك إنه مميز فعلاً مو بس أول بالقائمة */
  .podium::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.18) 45%,transparent 60%);
    transform:translateX(-120%);animation:podiumShine 5s ease-in-out infinite;
  }
  @keyframes podiumShine{ 0%{ transform:translateX(-120%); } 20%,100%{ transform:translateX(120%); } }
  @media (prefers-reduced-motion:reduce){ .podium::after{ animation:none;display:none; } }
  .p-row{ display:flex;align-items:center;gap:12px;position:relative; }
  .crown{ width:24px;height:24px;flex-shrink:0;color:var(--gold); }
  .p-avatar{
    width:42px;height:42px;border-radius:12px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.35);
    box-shadow:0 3px 8px -2px rgba(0,0,0,.35);
  }
  .p-info{ flex:1;min-width:0; }
  .p-name{ font-weight:800;font-size:13.5px; }
  .p-meta{ font-size:10px;color:rgba(255,255,255,.7);margin-top:1px; }
  .p-bal{ text-align:left; }
  .p-bal .n{ font-family:'Thmanyah','Tajawal',sans-serif;font-weight:800;font-size:17px;color:var(--gold); }

  .rows{ display:flex;flex-direction:column;gap:8px; }
  .row{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius);
    background:var(--surface);border:1px solid var(--border);cursor:pointer;
  }
  .rank{ width:18px;text-align:center;font-weight:800;font-size:12px;color:var(--text2);flex-shrink:0; }
  .avatar{
    width:32px;height:32px;border-radius:9px;flex-shrink:0;color:#fff;font-weight:800;font-size:12px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 6px -1px rgba(15,23,42,.35);
  }
  .info{ flex:1;min-width:0; }
  .name{ font-weight:700;font-size:12.5px; }
  .meta{ font-size:9.5px;color:var(--text2);margin-top:1px; }
  .bal{ font-weight:800;font-size:13px;color:var(--accent); }

  /* شارات صغيرة ملوّنة بدل نص رمادي مسطّح — عشان الأرقام تنقرأ بسرعة بنظرة وحدة */
  .meta-badges{ display:flex;align-items:center;gap:5px;margin-top:3px;flex-wrap:wrap; }
  .stat-pill{ font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap; }
  .stat-pill.win{ background:var(--green-bg);color:var(--green); }
  .stat-pill.loss{ background:var(--red-bg);color:var(--red); }
  .stat-pill.loan{ background:var(--gold-light);color:var(--gold-deep); }
  .team-dot{ width:7px;height:7px;border-radius:50%;flex-shrink:0; }
  /* نسخة على خلفية كحلية غامقة (كرت المتصدّر) — ألوان أفتح تناسب التباين الغامق */
  .p-meta .stat-pill{ background:rgba(255,255,255,.14); }
  .p-meta .stat-pill.win{ color:#6ee7a8; }
  .p-meta .stat-pill.loss{ color:#fca5a5; }
  [data-theme="dark"] .bal{ color:var(--gold); }
</style>
</head>
<body>

<header id="appHeader"></header>
<main class="container">

  <div class="live-strip"><span class="dot"></span>مباشر</div>

  <div id="matchesSection" class="reveal" style="animation-delay:0s;">
    <div class="sec-title" id="matchesTitle">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>
      مباريات الأسبوع
    </div>
    <div class="matches-wrap">
      <div class="matches-stack" id="matchesStack"></div>
      <div class="dots" id="matchesDots"></div>
    </div>
  </div>

  <div id="predictionsHubSection" class="reveal" style="animation-delay:.08s;" hidden>
    <div class="sec-title blue">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r=".5" fill="currentColor"/></svg>
      توقعات مفتوحة
    </div>
    <div id="predictionsHubList"></div>
  </div>

  <div id="tickerSection" class="reveal" style="animation-delay:.16s;">
    <div class="sec-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5.5L4 8v4c0 4.5 3 7.5 8 9 5-1.5 8-4.5 8-9V8l-4-1.5M8 12l2.5 2.5L16 9"/></svg>
      تصريحات الدوري
    </div>
    <div class="ticker-wrap">
      <div class="ticker" id="tickerWrap"></div>
      <div class="dots" id="tickerDots"></div>
    </div>
  </div>

  <div id="photosSection" class="reveal" style="animation-delay:.24s;">
    <div class="sec-title green">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-4-4 3-3-2-3 3"/></svg>
      صور الدوري
    </div>
    <div class="photos-wrap">
      <div class="photo-stack" id="photoStack"></div>
      <div class="dots" id="photoDots"></div>
    </div>
  </div>

  <div id="demandSection" class="reveal" style="animation-delay:.32s;margin-bottom:26px;" hidden>
    <div class="sec-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/></svg>
      الأكثر طلبًا
    </div>
    <div id="demandList" class="rows"></div>
  </div>

  <div id="rankingSection" class="reveal" style="animation-delay:.4s;">
    <div class="sec-title navy">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
      ترتيب الدوري
    </div>
    <div id="standingsList">
      <div class="empty-state"><div class="spinner" style="margin:0 auto 10px;"></div>جارٍ تحميل الترتيب...</div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/header.js"></script>
<script src="js/api/standings.js"></script>
<script src="js/api/matches.js"></script>
<script src="js/api/announcements.js"></script>
<script src="js/api/photos.js"></script>
<script src="js/api/reactions.js"></script>
<script src="js/ui/reactions.js"></script><script>
let profile = null;
let tickerTimer = null;
let matchesTimer = null;
const TICK_MS = 7000;
const MATCH_TICK_MS = 10000;

// كل قسم عنده "رقم نداء" خاص به — لو نداء أحدث بدأ قبل ما نخلص، نتجاهل نتيجتنا القديمة
// بدل ما ننشئ مؤقّت دوران ثاني يتزاحم مع الأحدث (كان يسبب قفزات/تسارع بالدوران)
let matchesRenderToken = 0, tickerRenderToken = 0, photoRenderToken = 0;

// لو رابط الشعار غير صالح (مثلًا أُدخل رقم جوال بالخطأ)، يرجع تلقائيًا لحرف اسم الفريق
// بدل أيقونة الصورة المكسورة، بدون ما يحتاج فحص الرابط مسبقًا
function crest(team){
  if(!team) return '?';
  const initial = team.name.slice(0,1);
  if(!team.logo_url) return initial;
  return `<img src="${team.logo_url}" style="width:100%;height:100%;object-fit:cover;border-radius:inherit;"
    onerror="this.style.display='none';this.nextElementSibling.style.display='inline';"/><span style="display:none;">${initial}</span>`;
}

// محرّك دوران مشترك بين "مباريات الأسبوع" و"تصريحات الدوري": يملأ النقاط تدريجيًا
// ويبدّل العنصر الفعّال كل intervalMs — يُستخدم لأن عدد/طول المحتوى الحقيقي متغيّر
const SLIDE_MS = 400;

function runRotator(itemSelector, dotsId, intervalMs, count){
  function setDots(activeIdx){
    document.querySelectorAll(`#${dotsId} .dseg i`).forEach((el, i) => {
      el.style.transition = "none";
      el.style.transform = i < activeIdx ? "scaleX(1)" : "scaleX(0)";
      if(i === activeIdx){
        void el.offsetWidth;
        el.style.transition = `transform ${intervalMs}ms linear`;
        el.style.transform = "scaleX(1)";
      }
    });
  }
  setDots(0);
  if(count < 2) return null;
  let idx = 0;
  let timer = null;

  function goTo(newIdx){
    const prev = idx;
    idx = ((newIdx % count) + count) % count;
    if(idx === prev) return;
    const prevEl = document.querySelector(`${itemSelector}[data-i="${prev}"]`);
    const nextEl = document.querySelector(`${itemSelector}[data-i="${idx}"]`);
    prevEl?.classList.remove("active");
    prevEl?.classList.add("leaving");
    nextEl?.classList.add("active");
    setTimeout(() => prevEl?.classList.remove("leaving"), SLIDE_MS);
    setDots(idx);
  }
  function restart(){
    if(timer) clearInterval(timer);
    timer = setInterval(() => goTo(idx + 1), intervalMs);
  }
  restart();

  // النقاط قابلة للضغط عشان تقفز لأي عنصر مباشرة، بدل ما تنتظر الدوران التلقائي
  document.querySelectorAll(`#${dotsId} .dseg`).forEach((el, i) => {
    el.style.cursor = "pointer";
    el.addEventListener("click", () => { goTo(i); restart(); });
  });

  // سحب يمين/يسار على الشريحة نفسها يقفز للي قبلها/بعدها
  const stackEl = document.querySelector(itemSelector)?.parentElement;
  if(stackEl){
    let touchStartX = null;
    stackEl.addEventListener("touchstart", (e) => { touchStartX = e.touches[0].clientX; }, { passive: true });
    stackEl.addEventListener("touchend", (e) => {
      if(touchStartX === null) return;
      const dx = e.changedTouches[0].clientX - touchStartX;
      touchStartX = null;
      if(Math.abs(dx) < 40) return;
      goTo(dx < 0 ? idx + 1 : idx - 1); // RTL: سحب لليسار = التالي
      restart();
    }, { passive: true });
  }

  return { clear(){ if(timer) clearInterval(timer); } };
}

function dotsHtml(count){
  return Array.from({length: count}, (_, i) => `<span class="dseg"><i data-d="${i}"></i></span>`).join("");
}

function matchCard(m, i){
  const isDone = m.status === "completed";
  return `
    <a class="match-card ${i === 0 ? 'active' : ''}" data-i="${i}" onclick="location.href='match.html?id=${m.id}'">
      <div class="mc-week">الأسبوع ${m.week?.week_number ?? '?'}${isDone ? ' · انتهت' : ''}</div>
      <div class="mc-teams">
        <div class="mc-team">
          <div class="mc-crest" style="background:${m.team_a?.primary_color || '#4b5563'}">${crest(m.team_a)}</div>
          <div class="mc-name">${m.team_a?.name || ''}</div>
        </div>
        <div class="mc-vs">VS</div>
        <div class="mc-team">
          <div class="mc-crest" style="background:${m.team_b?.primary_color || '#4b5563'}">${crest(m.team_b)}</div>
          <div class="mc-name">${m.team_b?.name || ''}</div>
        </div>
      </div>
      ${isDone
        ? `<div class="mc-result">الفائز: ${m.winner?.name || ''}</div>`
        : `<div class="mc-stakes"><span class="mc-stake">يدخل بـ ${m.team_a_stake}</span><span class="mc-stake">يدخل بـ ${m.team_b_stake}</span></div>`}
      <span class="mc-cta"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></span>
    </a>
  `;
}

async function renderMatches(){
  const myToken = ++matchesRenderToken;
  if(matchesTimer){ matchesTimer.clear(); matchesTimer = null; }
  const all = await listMatches();
  if(myToken !== matchesRenderToken) return;
  const upcoming = all
    .filter(m => m.status !== "completed" && m.status !== "cancelled")
    .sort((a, b) => (a.week?.week_number || 0) - (b.week?.week_number || 0));

  let toShow = upcoming;
  if(!toShow.length){
    const completed = all
      .filter(m => m.status === "completed")
      .sort((a, b) => (b.week?.week_number || 0) - (a.week?.week_number || 0));
    toShow = completed.slice(0, 1);
  }

  document.getElementById("matchesTitle").innerHTML = upcoming.length
    ? `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>مباريات الأسبوع`
    : `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>نتيجة آخر مباراة`;

  if(!toShow.length){
    document.getElementById("matchesStack").innerHTML = `<div class="match-card empty active">⚽ لم تُحدَّد أي مباراة بعد</div>`;
    document.getElementById("matchesDots").innerHTML = "";
    return;
  }
  document.getElementById("matchesStack").innerHTML = toShow.map(matchCard).join("");
  document.getElementById("matchesDots").innerHTML = toShow.length > 1 ? dotsHtml(toShow.length) : "";
  matchesTimer = runRotator(".match-card", "matchesDots", MATCH_TICK_MS, toShow.length);
}

function tickerTagStyle(a){
  if(!a.team) return `background:var(--gold-light);color:var(--gold-deep);`;
  return `background:color-mix(in srgb, ${a.team.primary_color || 'var(--accent)'} 16%, var(--surface));color:${a.team.primary_color || 'var(--accent)'};`;
}

async function renderTicker(){
  const myToken = ++tickerRenderToken;
  if(tickerTimer){ tickerTimer.clear(); tickerTimer = null; }
  let items = [];
  let loadFailed = false;
  try{ items = await listAnnouncements(12); }
  catch(err){ loadFailed = true; }
  if(myToken !== tickerRenderToken) return;

  if(!items.length){
    document.getElementById("tickerWrap").innerHTML = `
      <div class="tick empty active">📢 ${loadFailed
        ? 'لا توجد تصريحات بعد'
        : 'لا توجد تصريحات بعد — أضف أول تصريح من لوحة الإدارة'}</div>
    `;
    document.getElementById("tickerDots").innerHTML = "";
    return;
  }

  let reactionRows = [];
  try{ reactionRows = await listReactions("announcement", items.map(a => a.id)); }catch(err){ /* التفاعلات ثانوية، تجاهل الفشل */ }
  if(myToken !== tickerRenderToken) return;

  document.getElementById("tickerWrap").innerHTML = items.map((a, i) => `
    <div class="tick ${i === 0 ? 'active' : ''}" data-i="${i}" style="--team-color:${a.team?.primary_color || 'var(--gold)'}">
      <div class="tick-row">
        <span class="tb" style="${tickerTagStyle(a)}">${a.team ? a.team.name : 'الإدارة'}</span>
        <span class="tt">${a.body}</span>
      </div>
      ${reactionBarHtml("announcement", a.id, reactionRows, window.currentUserId)}
    </div>
  `).join("");
  document.getElementById("tickerDots").innerHTML = items.length > 1 ? dotsHtml(items.length) : "";
  tickerTimer = runRotator(".tick", "tickerDots", TICK_MS, items.length);
}

let photoTimer = null;
const PHOTO_TICK_MS = 8000;

async function renderPhotos(){
  const myToken = ++photoRenderToken;
  if(photoTimer){ photoTimer.clear(); photoTimer = null; }
  let items = [];
  let loadFailed = false;
  try{ items = await listPhotos(12); }
  catch(err){ loadFailed = true; }
  if(myToken !== photoRenderToken) return;

  if(!items.length){
    document.getElementById("photoStack").innerHTML = `
      <div class="photo-item empty active">📷 ${loadFailed
        ? 'لا توجد صور بعد'
        : 'لا توجد صور بعد — أضف أول صورة من لوحة الإدارة'}</div>
    `;
    document.getElementById("photoDots").innerHTML = "";
    return;
  }

  let reactionRows = [];
  try{ reactionRows = await listReactions("photo", items.map(p => p.id)); }catch(err){ /* التفاعلات ثانوية، تجاهل الفشل */ }
  if(myToken !== photoRenderToken) return;

  document.getElementById("photoStack").innerHTML = items.map((p, i) => `
    <div class="photo-item ${i === 0 ? 'active' : ''}" data-i="${i}">
      <div class="photo-frame-pub">
        <img src="${p.image_url}" alt=""/>
        ${p.caption ? `
          <div class="photo-caption-pub">
            <span class="tb">${p.team ? p.team.name : 'الإدارة'}</span>${p.caption}
          </div>
        ` : ''}
      </div>
      <div style="padding:10px 16px 12px;">${reactionBarHtml("photo", p.id, reactionRows, window.currentUserId)}</div>
    </div>
  `).join("");
  document.getElementById("photoDots").innerHTML = items.length > 1 ? dotsHtml(items.length) : "";
  photoTimer = runRotator(".photo-item", "photoDots", PHOTO_TICK_MS, items.length);
}

async function renderStandings(){
  const rows = await fetchStandings();
  const list = document.getElementById("standingsList");
  if(!rows.length){
    list.innerHTML = `<div class="empty-state">🏆 لا توجد فرق بعد.</div>`;
    return;
  }
  const [leader, ...rest] = rows;
  const leaderHtml = `
    <a class="podium" onclick="location.href='team-room.html?id=${leader.id}'">
      <div class="p-row">
        <svg class="crown" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/></svg>
        <div class="p-avatar" style="background:${leader.primary_color || '#4b5563'}">${crest(leader)}</div>
        <div class="p-info">
          <div class="p-name">${leader.name}</div>
          <div class="p-meta meta-badges">
            <span class="stat-pill win">${leader.wins} فوز</span>
            <span class="stat-pill loss">${leader.losses} خسارة</span>
          </div>
        </div>
        <div class="p-bal"><div class="n">${leader.balance_wathaq}<span class="coin lg">و</span></div></div>
      </div>
    </a>
  `;
  const restHtml = rest.map(t => `
    <a class="row" onclick="location.href='team-room.html?id=${t.id}'">
      <div class="rank">${t.rank}</div>
      <div class="avatar" style="background:${t.primary_color || '#4b5563'}">${crest(t)}</div>
      <div class="info">
        <div class="name">${t.name}</div>
        <div class="meta-badges">
          <span class="stat-pill win">${t.wins} فوز</span>
          <span class="stat-pill loss">${t.losses} خسارة</span>
        </div>
      </div>
      <div class="bal">${t.balance_wathaq}<span class="coin">و</span></div>
    </a>
  `).join("");
  list.innerHTML = leaderHtml + `<div class="rows">${restHtml}</div>`;
}

// أعلى 5 لاعبين حسب مجموع مبالغ الإعارة اللي فازوا فيها فعليًا (يُستعار ويفوز فريقه المستعير)
async function renderDemand(){
  const section = document.getElementById("demandSection");
  let rows = [];
  try{ rows = await fetchPlayerLoanDemand(5); }catch(err){ section.hidden = true; return; }
  if(!rows.length){ section.hidden = true; return; }
  section.hidden = false;

  document.getElementById("demandList").innerHTML = rows.map((p, i) => `
    <a class="row" onclick="location.href='team-room.html?id=${p.original_team_id}'">
      <div class="rank">${i + 1}</div>
      <div class="avatar" style="background:${p.team_color || '#4b5563'}">${crest({ name: p.team_name, logo_url: p.team_logo_url })}</div>
      <div class="info">
        <div class="name">${p.full_name}</div>
        <div class="meta-badges">
          <span class="team-dot" style="background:${p.team_color || '#4b5563'}"></span>
          <span style="font-size:10.5px;font-weight:700;color:var(--text2);">${p.team_name}</span>
          <span class="stat-pill loan">${p.loan_wins} فوز بالإعارة</span>
        </div>
      </div>
      <div class="bal">${p.loan_earnings}<span class="coin">و</span></div>
    </a>
  `).join("");
}

// كباتن الفرق غير المشاركة بمباراة معيّنة يقدرون يتوقعون فائزها من هنا مباشرة —
// بدل ما يحتاجون يروحون لصفحة كل مباراة يدوّرون عليها
async function renderPredictionsHub(){
  const section = document.getElementById("predictionsHubSection");
  if(!profile || !profile.team_id){ section.hidden = true; return; }

  let all = [];
  try{ all = await listMatches(); }catch(err){ section.hidden = true; return; }

  const eligible = all.filter(m =>
    m.prediction_enabled && m.status !== "completed" &&
    m.team_a_id !== profile.team_id && m.team_b_id !== profile.team_id
  );

  if(!eligible.length){ section.hidden = true; return; }
  section.hidden = false;

  const predictionsByMatch = {};
  await Promise.all(eligible.map(async m => {
    const preds = await listPredictionsForMatch(m.id);
    predictionsByMatch[m.id] = preds.find(p => p.predicting_team_id === profile.team_id);
  }));

  document.getElementById("predictionsHubList").innerHTML = eligible.map(m => {
    const mine = predictionsByMatch[m.id];
    const pickedName = mine ? (mine.predicted_winner_team_id === m.team_a_id ? m.team_a.name : m.team_b.name) : null;
    return `
      <div class="predhub-card glass">
        <div class="predhub-head">
          <span class="predhub-week">الأسبوع ${m.week?.week_number ?? '?'} · ${m.team_a.name} vs ${m.team_b.name}</span>
          <span class="predhub-reward">${m.prediction_reward}<span class="coin">و</span></span>
        </div>
        ${mine ? `
          <div style="font-size:12.5px;font-weight:700;color:var(--text2);">توقّعك: <b style="color:var(--gold-deep);">${pickedName}</b> ✓ (نهائي)</div>
        ` : `
          <div class="predhub-row">
            <button class="predhub-btn" onclick="onHubPredict('${m.id}','${m.team_a_id}','${m.team_a.name.replace(/'/g,"\\'")}')">${m.team_a.name}</button>
            <button class="predhub-btn" onclick="onHubPredict('${m.id}','${m.team_b_id}','${m.team_b.name.replace(/'/g,"\\'")}')">${m.team_b.name}</button>
          </div>
        `}
      </div>
    `;
  }).join("");
}

async function onHubPredict(matchId, teamId, teamName){
  if(!confirm(`متأكد تتوقع فوز ${teamName}؟ التوقع نهائي وما يتغيّر بعدها.`)) return;
  try{
    await submitPrediction(matchId, teamId);
    showToast("تم تسجيل توقعك", "success");
    await renderPredictionsHub();
  }catch(err){ showToast(err.message, "error"); }
}

(async function init(){
  profile = await optionalAuth();
  window.currentUserId = profile ? profile.id : null;
  renderHeader(profile, "standings");
  await Promise.all([renderMatches(), renderTicker(), renderPhotos(), renderPredictionsHub(), renderStandings(), renderDemand()]);

  sb
    .channel("home-live")
    .on("postgres_changes", { event: "*", schema: "public", table: "teams" }, renderStandings)
    .on("postgres_changes", { event: "*", schema: "public", table: "standings_snapshots" }, renderStandings)
    .on("postgres_changes", { event: "*", schema: "public", table: "matches" }, () => { renderMatches(); renderPredictionsHub(); renderDemand(); })
    .on("postgres_changes", { event: "*", schema: "public", table: "league_announcements" }, renderTicker)
    .on("postgres_changes", { event: "*", schema: "public", table: "league_photos" }, renderPhotos)
    .on("postgres_changes", { event: "*", schema: "public", table: "match_predictions" }, renderPredictionsHub)
    .on("postgres_changes", { event: "*", schema: "public", table: "match_loans" }, renderDemand)
    .subscribe();
})();
</script>
