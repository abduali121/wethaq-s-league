<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>عدّاد النقاط - دوري وثاق</title>
<link rel="stylesheet" href="assets/css/theme.css"/>
<link rel="stylesheet" href="assets/css/components.css"/>
<style>
  .sb-wrap{ max-width:640px;margin:0 auto;padding:16px 14px 40px; }
  .sb-title{ text-align:center;font-size:14px;font-weight:800;color:var(--text2);margin-bottom:16px; }
  .sb-board{ display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin-bottom:18px; }
  .sb-side{
    background:linear-gradient(150deg,var(--accent),var(--accent2));border:1px solid var(--gold);color:#fff;
    border-radius:var(--radius-lg);padding:20px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;
    box-shadow:0 14px 26px -12px rgba(15,37,64,.5);
  }
  .sb-side select{
    width:100%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:var(--radius-sm);padding:8px;font-family:inherit;font-size:13px;font-weight:700;text-align:center;
  }
  .sb-side select option{ color:#000; }
  .sb-sets{
    font-size:11.5px;font-weight:800;color:var(--gold);background:rgba(255,255,255,.14);
    padding:3px 12px;border-radius:999px;
  }
  .sb-score{
    font-family:'Thmanyah','Tajawal',sans-serif;font-size:60px;font-weight:800;color:var(--gold);
    line-height:1;user-select:none;
  }
  .sb-btns{ display:flex;gap:8px;width:100%; }
  .sb-btn{
    flex:1;padding:14px 0;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.14);color:#fff;font-size:20px;font-weight:800;cursor:pointer;
  }
  .sb-btn:active{ transform:scale(.95); }
  .sb-btn.minus{ font-size:16px;opacity:.75; }
  .sb-set-btn{
    width:100%;padding:9px;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,.35);
    background:rgba(255,255,255,.1);color:#fff;font-size:11.5px;font-weight:800;cursor:pointer;
  }
  .sb-set-btn:active{ transform:scale(.96); }
  .sb-vs{ display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--text2);font-size:13px; }
  .sb-actions{ display:flex;gap:10px;justify-content:center; }
  .back-link{ display:block;text-align:center;margin-top:20px;font-size:12px;color:var(--text2); }
</style>
</head>
<body>

<header id="appHeader"></header>
<main class="sb-wrap">
  <div class="sb-title">عدّاد نقاط حيّ — بدون عدد نهائي، أنت تحدد الفائز</div>

  <div class="sb-board">
    <div class="sb-side">
      <select id="teamASelect"></select>
      <div class="sb-sets" id="setsA">المجموعات: ٠</div>
      <div class="sb-score" id="scoreA">0</div>
      <div class="sb-btns">
        <button class="sb-btn minus" onclick="changeScore('A', -1)">−١</button>
        <button class="sb-btn" onclick="changeScore('A', 1)">+١</button>
      </div>
      <button class="sb-set-btn" onclick="winSet('A')">🏆 فوز بهذي المجموعة</button>
    </div>
    <div class="sb-vs">VS</div>
    <div class="sb-side">
      <select id="teamBSelect"></select>
      <div class="sb-sets" id="setsB">المجموعات: ٠</div>
      <div class="sb-score" id="scoreB">0</div>
      <div class="sb-btns">
        <button class="sb-btn minus" onclick="changeScore('B', -1)">−١</button>
        <button class="sb-btn" onclick="changeScore('B', 1)">+١</button>
      </div>
      <button class="sb-set-btn" onclick="winSet('B')">🏆 فوز بهذي المجموعة</button>
    </div>
  </div>

  <div class="sb-actions">
    <button class="btn" onclick="resetPoints()">تصفير نقاط المجموعة الحالية</button>
    <button class="btn" onclick="resetAll()">مباراة جديدة (تصفير الكل)</button>
  </div>

  <a href="index.html" class="back-link">← رجوع</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script><script src="js/auth.js"></script>
<script src="js/ui/toast.js"></script>
<script src="js/ui/theme.js"></script>
<script src="js/ui/header.js"></script>
<script src="js/api/teams.js"></script>
<script>
const STORAGE_KEY = "dawri_scoreboard";
let state = { points: { A: 0, B: 0 }, sets: { A: 0, B: 0 } };

function loadState(){
  try{
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
    if(saved && saved.points && saved.sets) state = saved;
  }catch(e){}
}
function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

function render(){
  document.getElementById("scoreA").textContent = state.points.A;
  document.getElementById("scoreB").textContent = state.points.B;
  document.getElementById("setsA").textContent = `المجموعات: ${state.sets.A}`;
  document.getElementById("setsB").textContent = `المجموعات: ${state.sets.B}`;
}

function changeScore(side, delta){
  state.points[side] = Math.max(0, state.points[side] + delta);
  render();
  saveState();
}

// فوز فريق بمجموعة: يزيد عداد المجموعات له، ويصفّر النقاط استعدادًا للمجموعة الجاية —
// بدون أي عدد نقاط ثابت يحدد الفوز، القرار للي يستخدم الأداة
function winSet(side){
  const teamName = document.getElementById(`team${side}Select`).value;
  if(!confirm(`${teamName} فاز بهذي المجموعة؟ بتصفّر النقاط للمجموعة الجاية.`)) return;
  state.sets[side] += 1;
  state.points.A = 0;
  state.points.B = 0;
  render();
  saveState();
  showToast(`${teamName} أخذ المجموعة (${state.sets[side]})`, "success");
}

function resetPoints(){
  state.points = { A: 0, B: 0 };
  render();
  saveState();
}

function resetAll(){
  if(!confirm("تصفير كل شي (النقاط والمجموعات) لمباراة جديدة؟")) return;
  state = { points: { A: 0, B: 0 }, sets: { A: 0, B: 0 } };
  render();
  saveState();
}

(async function(){
  const profile = await optionalAuth();
  renderHeader(profile, "scoreboard");

  loadState();
  render();

  try{
    const teams = await listTeams();
    const opts = teams.map(t => `<option value="${t.name}">${t.name}</option>`).join("");
    document.getElementById("teamASelect").innerHTML = opts;
    document.getElementById("teamBSelect").innerHTML = opts;
    if(teams[1]) document.getElementById("teamBSelect").value = teams[1].name;
  }catch(e){}
})();
</script>
</body>
</html>
